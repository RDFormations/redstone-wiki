# Prod VPS — /opt/redstone-wiki (données + compose) ; build depuis clone redstone-wiki
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: wiki
      POSTGRES_USER: wikijs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wikijs -d wiki"]
      interval: 10s
      timeout: 5s
      retries: 5

  wiki:
    build:
      context: ${REDSTONE_WIKI_ROOT}
      dockerfile: Dockerfile
      target: release
    image: redstone-wiki:2.5-redstone
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DB_TYPE: postgres
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: wikijs
      DB_PASS: ${POSTGRES_PASSWORD}
      DB_NAME: wiki
      REDSTONE_LMS_AGENT_TOKEN: ${REDSTONE_LMS_AGENT_TOKEN:-}
      REDSTONE_LMS_FORMATEUR_TOKEN: ${REDSTONE_LMS_FORMATEUR_TOKEN:-}
      REDSTONE_LMS_OPS_TOKEN: ${REDSTONE_LMS_OPS_TOKEN:-}
      REDSTONE_LMS_TRAINER_AUTO_PROVISION: ${REDSTONE_LMS_TRAINER_AUTO_PROVISION:-1}
      REDSTONE_CHATBOT_URL: ${REDSTONE_CHATBOT_URL:-https://ops.redstoneformations.fr/agent-gateway/lms/chatbot}
      REDSTONE_CHATBOT_TOKEN: ${REDSTONE_CHATBOT_TOKEN:-}
      WIKI_SITE_HOST: ${WIKI_SITE_HOST:-https://formation.redstoneformations.fr}
      MONDAY_API_TOKEN: ${MONDAY_API_TOKEN:-${MONDAY_TOKEN:-}}
      MONDAY_MISSIONS_BOARD_ID: ${MONDAY_MISSIONS_BOARD_ID:-18420737449}
      MONDAY_LMS_COL_PORTAL_STATUS: ${MONDAY_LMS_COL_PORTAL_STATUS:-}
      MONDAY_LMS_COL_SUPPORT_READY: ${MONDAY_LMS_COL_SUPPORT_READY:-}
      MONDAY_LMS_COL_SESSION_STATE: ${MONDAY_LMS_COL_SESSION_STATE:-}
      MONDAY_LMS_COL_LAST_SYNC: ${MONDAY_LMS_COL_LAST_SYNC:-}
      MONDAY_LMS_COL_ERROR_DETAIL: ${MONDAY_LMS_COL_ERROR_DETAIL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data/wiki:/wiki/data
      - ${RDF_FORMATIONS_ROOT:-/home/ubuntu/RDF-formations}:/repo:ro

  wiki-builder:
    profiles: ["dev"]
    build:
      context: ${REDSTONE_WIKI_ROOT}
      dockerfile: Dockerfile
      target: deps
    image: redstone-wiki:deps
    volumes:
      - ${REDSTONE_WIKI_ROOT}:/wiki
      - wiki-node-modules:/wiki/node_modules
      - ./build:/out
    working_dir: /wiki
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        yarn build
        mkdir -p /out/assets /out/server
        rsync -a --delete assets/ /out/assets/
        rsync -a --delete server/ /out/server/

volumes:
  wiki-node-modules:
